name: Build Runpod workers

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-workers.yml
      - workers/shared/**
      - workers/image/**
      - workers/qwen_image_21/**
      - workers/moss_image/**
      - workers/fibo_2/**
      - workers/krea2/**
      - workers/joycaption/**
      - scripts/krea2_image.py
      - scripts/qwen_image_21.py
      - scripts/moss_image.py
      - scripts/fibo_2.py
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated images to GHCR
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        worker: [image, joycaption]
    env:
      WORKER: ${{ matrix.worker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make room for CUDA dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - name: Select image name
        shell: bash
        run: |
          printf 'IMAGE=ghcr.io/%s-%s:%s\n' "${GITHUB_REPOSITORY,,}" "$WORKER" "$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Build the complete CUDA image
        shell: bash
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --file "workers/${WORKER}/Dockerfile" --tag "$IMAGE" .
      - name: Check dependencies and startup packaging
        shell: bash
        run: |
          docker run --rm --entrypoint uv "$IMAGE" pip check --python /.venv/bin/python
          if [ "$WORKER" = image ]; then
            docker run --rm --entrypoint python "$IMAGE" -u /app/workers/krea2/download_weights.py --help
            docker run --rm --entrypoint python "$IMAGE" -u /app/workers/qwen_image_21/download_weights.py --help
            docker run --rm --entrypoint python "$IMAGE" -u /app/workers/moss_image/download_weights.py --help
            docker run --rm --entrypoint python "$IMAGE" -u /app/scripts/moss_image.py --help
            docker run --rm --entrypoint python "$IMAGE" -u /app/workers/fibo_2/download_weights.py --help
            docker run --rm --entrypoint python "$IMAGE" -u /app/scripts/fibo_2.py --help
          else
            docker run --rm --entrypoint python "$IMAGE" -u /app/download_weights.py --help
          fi
      - name: Check image worker bootstrap and shared helpers
        if: matrix.worker == 'image'
        shell: bash
        run: |
          docker run --rm --entrypoint python "$IMAGE" -u /app/workers/shared/bootstrap.py --help
      - name: Check model runtime imports without loading weights
        shell: bash
        run: |
          docker run --rm --env WORKER --entrypoint python "$IMAGE" -c '
          import importlib, inspect, os, torch, torchvision
          assert torch.version.cuda == "12.8", torch.version.cuda
          worker = os.environ["WORKER"]
          if worker == "joycaption":
              assert torch.__version__ == "2.8.0+cu128", torch.__version__
              assert torchvision.__version__ == "0.23.0+cu128", torchvision.__version__
              import caption_utils, schemas, caption_runtime, model_store, handler
              import transformers
              from transformers import AutoProcessor, Qwen3_5ForConditionalGeneration
              assert handler.MODELS is None
              assert transformers.__version__ == "5.20.1", transformers.__version__
              compiled_arches = torch._C._cuda_getArchFlags().split()
              assert "sm_120" in compiled_arches, compiled_arches
          else:
              assert torch.__version__ == "2.9.1+cu128", torch.__version__
              assert torchvision.__version__ == "0.24.1+cu128", torchvision.__version__
              import runpy, runpod, transformers
              from image_worker.backends import REGISTRY
              from diffusers import AutoencoderKLQwenImage, QwenImage21Pipeline
              from fibo_2_infer.pipeline import BriaFibo2Pipeline, BriaFibo2Transformer2DModel, AutoencoderKLFlux2
              from transformers import Qwen3VLForConditionalGeneration
              from moss_image_infer.pipeline import MOSSImagePipeline, MOSSImageTransformer
              from transformers import Qwen3_5Model
              assert set(REGISTRY) == {"krea2", "qwen_image_21", "moss_image", "fibo_2"}
              assert transformers.__version__ == "5.20.1", transformers.__version__
              assert "reference_resolution" in inspect.signature(QwenImage21Pipeline.__call__).parameters
              registered = []
              runpod.serverless.start = registered.append
              runpy.run_path("/app/workers/image/handler.py", run_name="image_startup_check")
              assert len(registered) == 1 and callable(registered[0]["handler"])
              print("All four model backends and request-selected handler imported without weights")
          print("Runtime imports OK; torch=" + torch.__version__ +
                " torchvision=" + torchvision.__version__ + " cuda=" + torch.version.cuda)
          '
      - name: Check caption API, pinned cache and staged shard loading
        if: matrix.worker == 'joycaption'
        shell: bash
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/src:ro" \
            --env PYTHONPATH=/src/workers/joycaption:/src/workers --entrypoint sh "$IMAGE" -c \
            'uv pip install --no-cache -c /app/torch-constraints.txt pytest && python -m pytest /src/workers/joycaption/tests -q'
      - name: Check common worker and all model backends
        if: matrix.worker == 'image'
        shell: bash
        run: |
          for suite in shared image krea2 qwen_image_21 moss_image fibo_2; do
            docker run --rm --entrypoint sh "$IMAGE" -c '
              # Model unit suites set generic paths in controlled fixtures.
              # Backend tests separately exercise the model-prefixed settings.
              unset QWEN_MODEL_DIR QWEN_BASE_MODEL_DIR QWEN_LORA_DIR QWEN_MODEL_ID QWEN_BASE_MODEL_ID
              unset KREA_MODEL_DIR KREA_LORA_DIR KREA_DIT_QUANT LORA_CACHE_DIR
              unset MOSS_MODEL_DIR MOSS_OFFLOAD
              unset FIBO_MODEL_DIR FIBO_OFFLOAD
              exec python -m unittest discover -s "/app/workers/$1/tests" -p "test_*.py"
            ' sh "$suite"
          done
      - name: Publish validated image
        if: github.event_name == 'push' || inputs.publish
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
      - name: Record image name
        shell: bash
        run: |
          printf '%s\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
